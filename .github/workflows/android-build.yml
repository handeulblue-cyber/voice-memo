name: Android Build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Ensure official Gradle Wrapper JAR
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl --fail --location --retry 3 https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          fi
          echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Validate wrapper and configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Python 3.11 for speech model checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare bundled offline Korean model
        run: python3 scripts/prepare_model.py
      - name: Compare offline Korean recognition on public samples
        run: |
          python3 -m venv /tmp/stt-test
          /tmp/stt-test/bin/pip install sherpa-onnx==1.12.26 vosk==0.3.45 numpy
          /tmp/stt-test/bin/python scripts/compare_stt.py
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon --console=plain --stacktrace testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK and privacy permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee apk-permissions.txt
          if grep -q 'android.permission.INTERNET' apk-permissions.txt; then
            echo '::error::APK unexpectedly requests INTERNET permission'
            exit 1
          fi
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              assert apk.getinfo('assets/korean.zip').file_size > 50_000_000, 'Korean model missing'
              assert apk.getinfo('assets/whisper-small.zip').file_size > 100_000_000, 'Whisper model missing'
              for abi in ['arm64-v8a', 'armeabi-v7a', 'x86_64']:
                  assert any(n.startswith('lib/' + abi + '/') and 'vosk' in n for n in apk.namelist()), abi
                  assert any(n.startswith('lib/' + abi + '/') and 'sherpa-onnx-jni' in n for n in apk.namelist()), abi
          PY
          sha256sum "$APK" > apk-sha256.txt
          echo 'APK: voice-memo-debug-apk artifact (unzip before installation)' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-memo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload test and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            apk-permissions.txt
            apk-sha256.txt
            licenses/model-sha256.txt
            stt-comparison.json
          if-no-files-found: ignore
          retention-days: 14
